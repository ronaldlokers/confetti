services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: confetti
      POSTGRES_USER: confetti
      POSTGRES_PASSWORD: confetti
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confetti -d confetti"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
